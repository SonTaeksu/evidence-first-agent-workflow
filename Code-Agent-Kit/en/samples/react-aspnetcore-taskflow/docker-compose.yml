services:
  api:
    build:
      context: ./backend/TaskFlow.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      FrontendOrigin: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - api
    ports:
      - "5173:80"
