name: CI

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r tools/reference-image-manifest/requirements.txt
      - run: python -m compileall tools

      # Every self-test, by enumeration rather than by list.
      #
      # This used to name five of them individually. Four others existed and were
      # never run, and one of those four — check-kit-selfcheck — had been failing
      # for three releases: its check classified another tool's findings by prose,
      # the other tool's messages had since gained identifiers, and the assertion
      # silently became inert. The self-test caught it. Nothing ran the self-test.
      #
      # A hand-written list goes stale the moment somebody adds a tool, and the
      # cost of that staleness is a gate that looks enforced and is not. The glob
      # cannot go stale, and `set -e` means a new self-test is wired in the moment
      # it is written.
      - name: Every tool self-test
        run: |
          set -e
          for test in tools/*/self_test.py; do
            echo "== $test"
            python "$test"
          done

      # The PowerShell twins are the only gate on a machine without Python, so an
      # unverified twin must fail this job rather than be assumed correct. pwsh is
      # preinstalled on GitHub's ubuntu runners; this check exits 1 without it.
      - name: PowerShell twins agree with their Python originals
        run: python tools/check-script-parity/check_script_parity.py --root .

      - run: python tools/check-agent-config/check_agent_config.py --root .
      - run: python tools/check-shell-safety/check_shell_safety.py --root .
      - run: python tools/check-kit-selfcheck/check_kit_selfcheck.py --root .
      - run: python tools/check-stack-readiness/check_stack_readiness.py --stack stacks/react-aspnetcore
      - run: python tools/check-state-model/check_state_model.py --project-docs samples/react-aspnetcore-taskflow/docs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/react-aspnetcore-taskflow/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16"
          cache: npm
          cache-dependency-path: samples/react-aspnetcore-taskflow/frontend/package-lock.json
      - run: node --check ../../../tools/spa-screen-extractor/extract_screen.js
      - run: npm ci
      - run: npm run color:static
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/react-aspnetcore-taskflow/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore TaskFlow.Api.Tests/TaskFlow.Api.Tests.csproj
      - run: dotnet build TaskFlow.Api.Tests/TaskFlow.Api.Tests.csproj --no-restore
      - run: dotnet test TaskFlow.Api.Tests/TaskFlow.Api.Tests.csproj --no-build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/react-aspnetcore-taskflow/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16"
          cache: npm
          cache-dependency-path: samples/react-aspnetcore-taskflow/frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:color

  enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Enforce evidence-first gates on the diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          python tools/enforce-agent-gates/enforce_gates.py --base "$BASE"
      - name: Sanitization gate (no proprietary strings)
        run: python tools/check-sanitization/check_sanitization.py --root .
